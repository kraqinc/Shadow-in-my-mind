name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Shadow in My Mind
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform:          Android
          buildName:               ShadowInMyMind
          buildsPath:              build
          androidExportType:       androidPackage
          androidKeystoreName:     ${{ secrets.ANDROID_KEYSTORE_NAME }}
          androidKeystoreBase64:   ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass:     ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName:     ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass:     ${{ secrets.ANDROID_KEYALIAS_PASS }}
          unityVersion:            auto

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowInMyMind-${{ github.run_number }}
          path: build/Android/*.apk
          retention-days: 14

      - name: Release on main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   build-${{ github.run_number }}
          name:       "Shadow in My Mind — Build ${{ github.run_number }}"
          prerelease: true
          files:      build/Android/*.apk
          body:       "Auto build from `${{ github.sha }}`\n\n${{ github.event.head_commit.message }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
